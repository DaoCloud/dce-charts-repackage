{{- if and .Values.devicePlugin.enabled (not .Values.dra.enabled) -}}
{{- if .Values.scheduler.serviceMonitor.enable }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    operator.insight.io/managed-by: insight
    {{- include "hami-enterprise.labels" . | nindent 4 }}
  name: {{ include "hami-enterprise.device-plugin" . }}-exporter
  namespace: {{ include "hami-enterprise.namespace" . }}
spec:
  endpoints:
  - bearerTokenSecret:
      key: ""
    interval: 15s
    metricRelabelings:
    - action: replace
      sourceLabels:
      - podname
      targetLabel: exported_pod
    - action: replace
      sourceLabels:
      - podnamespace
      targetLabel: exported_namespace
    path: /metrics
    port: monitorport
    relabelings:
    - action: replace
      sourceLabels:
      - __meta_kubernetes_endpoint_node_name
      targetLabel: node
  jobLabel: app
  namespaceSelector:
    matchNames:
    - {{ include "hami-enterprise.namespace" . }}
  selector:
    matchLabels:
      app.kubernetes.io/component: hami-device-plugin
{{- end }}
{{- end -}}
