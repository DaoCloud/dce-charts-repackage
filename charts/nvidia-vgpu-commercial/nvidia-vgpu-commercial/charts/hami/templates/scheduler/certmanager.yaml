{{- if and .Values.scheduler.admissionWebhook.enabled (not .Values.dra.enabled) -}}
{{- if .Values.scheduler.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "hami-enterprise.scheduler" . }}-serving-cert
  namespace: {{ include "hami-enterprise.namespace" . }}
  labels:
    app.kubernetes.io/component: hami-scheduler
    {{- include "hami-enterprise.schedulerLabels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ include "hami-enterprise.scheduler" . }}.{{ include "hami-enterprise.namespace" . }}.svc
    - {{ include "hami-enterprise.scheduler" . }}.{{ include "hami-enterprise.namespace" . }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "hami-enterprise.scheduler" . }}-selfsigned-issuer
  secretName: {{ include "hami-enterprise.scheduler.tls" . }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "hami-enterprise.scheduler" . }}-selfsigned-issuer
  namespace: {{ include "hami-enterprise.namespace" . }}
  labels:
    app.kubernetes.io/component: hami-scheduler
    {{- include "hami-enterprise.schedulerLabels" . | nindent 4 }}
spec:
  selfSigned: {}
{{- end }}
{{- end }}
