{{/* Enterprise allocation validation is maintained separately from the upstream mutating webhook. */}}
{{- if eq (include "hami-enterprise.allocationValidationEnabled" .) "true" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  {{- if .Values.scheduler.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ include "hami-enterprise.namespace" . }}/{{ include "hami-enterprise.scheduler" . }}-serving-cert
  {{- end }}
  # Reuse the mutating webhook name so kube-webhook-certgen patches both CA bundles.
  name: {{ include "hami-enterprise.scheduler.webhook" . }}
webhooks:
  {{- if eq (include "hami-enterprise.vnpuAdmissionGuardEnabled" .) "true" }}
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "hami-enterprise.scheduler" . }}
        namespace: {{ include "hami-enterprise.namespace" . }}
        path: /vnpu/validate
        port: {{ .Values.scheduler.service.httpPort }}
    failurePolicy: Fail
    matchPolicy: Equivalent
    name: vnpu-allocation-guard.hami.io
    matchConditions:
      - name: protected-vnpu-annotation-changed
        expression: >-
          (request.operation == 'CREATE' &&
           {{ include "hami-enterprise.vnpuCreateReservedAnnotationCELList" . }}.exists(k,
             has(object.metadata.annotations) && k in object.metadata.annotations)) ||
          (request.operation == 'UPDATE' &&
           {{ include "hami-enterprise.vnpuProtectedAnnotationCELList" . }}.exists(k,
             ((has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations) !=
              (has(object.metadata.annotations) && k in object.metadata.annotations)) ||
             (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations &&
              has(object.metadata.annotations) && k in object.metadata.annotations &&
              oldObject.metadata.annotations[k] != object.metadata.annotations[k])))
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
        scope: '*'
    sideEffects: None
    timeoutSeconds: 10
  {{- end }}
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "hami-enterprise.scheduler" . }}
        namespace: {{ include "hami-enterprise.namespace" . }}
        path: /downward/validate
        port: {{ .Values.scheduler.service.httpPort }}
    failurePolicy: Fail
    matchPolicy: Equivalent
    name: downward-allocation-bounds.hami.io
    matchConditions:
      - name: uses-downward-runtime-limits
        expression: >-
          object.spec.containers.exists(c, has(c.env) && c.env.exists(e,
            (e.name == 'NVIDIA_VISIBLE_DEVICES' || e.name.startsWith('CUDA_DEVICE_MEMORY_LIMIT') || e.name.startsWith('CUDA_DEVICE_SM_LIMIT')) &&
            has(e.valueFrom) && has(e.valueFrom.fieldRef))) ||
          (has(object.spec.initContainers) && object.spec.initContainers.exists(c, has(c.env) && c.env.exists(e,
            (e.name == 'NVIDIA_VISIBLE_DEVICES' || e.name.startsWith('CUDA_DEVICE_MEMORY_LIMIT') || e.name.startsWith('CUDA_DEVICE_SM_LIMIT')) &&
            has(e.valueFrom) && has(e.valueFrom.fieldRef))))
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
        scope: '*'
    sideEffects: None
    timeoutSeconds: 10
{{- end }}
