{{- if not .Values.dra.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hami-enterprise.scheduler" . }}-kube
  labels:
    app.kubernetes.io/component: "hami-scheduler"
    {{- include "hami-enterprise.schedulerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
  - kind: ServiceAccount
    name: {{ include "hami-enterprise.scheduler" . }}
    namespace: {{ include "hami-enterprise.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hami-enterprise.scheduler" . }}-volume
  labels:
    app.kubernetes.io/component: "hami-scheduler"
    {{- include "hami-enterprise.schedulerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:volume-scheduler
subjects:
  - kind: ServiceAccount
    name: {{ include "hami-enterprise.scheduler" . }}
    namespace: {{ include "hami-enterprise.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hami-enterprise.scheduler" . }}
  labels:
    app.kubernetes.io/component: "hami-scheduler"
    {{- include "hami-enterprise.schedulerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hami-enterprise.scheduler" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hami-enterprise.scheduler" . }}
    namespace: {{ include "hami-enterprise.namespace" . }}
{{- end }}
