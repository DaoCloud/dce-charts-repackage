apiVersion: v1
kind: Service
metadata:
  name: {{ include "iaas-network-provider.fullname" . }}
  labels:
    {{- include "iaas-network-provider.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      name: https
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort.https }}
      nodePort: {{ .Values.service.nodePort.https }}
      {{- end }}
  selector:
    {{- include "iaas-network-provider.selectorLabels" . | nindent 4 }}
