{{- include "iaas-network-provider.validateValues" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "iaas-network-provider.fullname" . }}
  labels:
    {{- include "iaas-network-provider.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $ctl := .Values.controller }}
    {{- $cloud := .Values.cloud }}
    controller:
      logLevel: {{ $ctl.logLevel }}
      bindAddress: "{{ $ctl.bindAddress }}"
      tls:
        certFile: "{{ .Values.tls.certFile }}"
        keyFile: "{{ .Values.tls.keyFile }}"
      pprof:
        enabled: {{ $ctl.pprof.enabled }}
        bindAddress: "{{ $ctl.pprof.bindAddress }}"
      k8sClientConfig:
        qps: {{ $ctl.k8sClientConfig.qps }}
        burst: {{ $ctl.k8sClientConfig.burst }}
      rateLimit:
        qps: {{ $ctl.rateLimit.qps }}
        burst: {{ $ctl.rateLimit.burst }}
        queueTimeoutSeconds: {{ $ctl.rateLimit.queueTimeoutSeconds }}
        maxTransactionTimeoutSeconds: {{ default 0 $ctl.rateLimit.maxTransactionTimeoutSeconds }}
      leaderElection:
        enabled: {{ $ctl.leaderElection.enabled }}
        leaseName: {{ $ctl.leaderElection.leaseName }}
        leaseNamespace: {{ .Release.Namespace }}
        leaseDurationSeconds: {{ $ctl.leaderElection.leaseDurationSeconds }}
        renewDeadlineSeconds: {{ $ctl.leaderElection.renewDeadlineSeconds }}
        retryPeriodSeconds: {{ $ctl.leaderElection.retryPeriodSeconds }}
      cache:
        preloadOnStartup: {{ $ctl.cache.preloadOnStartup }}
        iaasNetCacheTTLMinutes: {{ $ctl.cache.iaasNetCacheTTLMinutes }}
      {{- $mgr := $ctl.ippoolManager }}
      ippoolManager:
        ipWorkersPerPool: {{ $mgr.ipWorkersPerPool }}
        nodePoolLabelSelector: "{{ $mgr.nodePoolLabelSelector }}"
        ipRecycleStrategy: "{{ $mgr.ipRecycleStrategy }}"
        ipIdleTTLSeconds: {{ $mgr.ipIdleTTLSeconds }}
        {{- /* Advanced tuning keys below default in code; render only when set via --set/values override. */}}
        {{- range $key := list "errorRetryIntervalSeconds" "detachThreshold" "deleteThreshold" "flushDebounceMs" "recycleDebounceSeconds" "recycleResyncIntervalSeconds" "reconcileIntervalSeconds" }}
        {{- if hasKey $mgr $key }}
        {{ $key }}: {{ index $mgr $key }}
        {{- end }}
        {{- end }}
    cloud:
      provider: "{{ $cloud.provider }}"
      accessConfig:
        region: "{{ $cloud.accessConfig.region }}"
        projectID: "{{ $cloud.accessConfig.projectID }}"
        projectName: "{{ $cloud.accessConfig.projectName }}"
        endpoint: "{{ $cloud.accessConfig.endpoint }}"
        vpcEndpoint: "{{ $cloud.accessConfig.vpcEndpoint }}"
        ecsEndpoint: "{{ $cloud.accessConfig.ecsEndpoint }}"
        iamEndpoint: "{{ $cloud.accessConfig.iamEndpoint }}"
        scEndpoint: "{{ $cloud.accessConfig.scEndpoint }}"
        securityGroups: {{ toJson (default (list) $cloud.accessConfig.securityGroups) }}
      httpRequestTimeout: "{{ $cloud.httpRequestTimeout }}"
      allowInsecureHTTP: {{ $cloud.allowInsecureHTTP }}
      maxSubEniPerNode: {{ $cloud.maxSubEniPerNode }}
      maxSubEniPerMachine: {{ $cloud.maxSubEniPerMachine }}
      auth:
        mode: "{{ $cloud.auth.mode }}"
        token:
          username: "{{ $cloud.auth.token.username }}"
          iamDomain: "{{ $cloud.auth.token.iamDomain }}"
          agencyName: "{{ $cloud.auth.token.agencyName }}"
          trustTenantName: "{{ $cloud.auth.token.trustTenantName }}"
          tokenRefreshInterval: "{{ $cloud.auth.token.tokenRefreshInterval }}"
          tokenRefreshBeforeExpiry: "{{ $cloud.auth.token.tokenRefreshBeforeExpiry }}"
          tokenRefreshRetryInterval: "{{ $cloud.auth.token.tokenRefreshRetryInterval }}"
          tokenRefreshFailThreshold: {{ $cloud.auth.token.tokenRefreshFailThreshold }}
