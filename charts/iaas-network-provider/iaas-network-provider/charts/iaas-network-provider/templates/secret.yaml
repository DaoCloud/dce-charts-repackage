{{/*
This template is a placeholder reminder.
In production, the Secret should be created manually or via an external secrets manager.

Example:
  kubectl create secret generic huawei-credentials \
    --from-literal=CLOUD_ACCESS_KEY=xxx \
    --from-literal=CLOUD_SECRET_KEY=xxx
*/}}

{{- if and .Values.tls.autoGenerate (not .Values.tls.existingSecret) }}
{{- $name := include "iaas-network-provider.fullname" . -}}
{{- $secretName := printf "%s-tls" $name -}}
{{/*
Reuse the existing Secret across upgrades so the CA stays stable: clients
(e.g. spiderpool) pin ca.crt to verify this server, and regenerating on
every upgrade would break them. Certificates are only (re)generated on
first install, or when the existing Secret is missing ca.crt (Secrets
created by older chart versions). Delete the Secret and upgrade to force
a CA rotation.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $tlsCrt := "" -}}
{{- $tlsKey := "" -}}
{{- $caCrt := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "tls.crt") (hasKey $existing.data "tls.key") (hasKey $existing.data "ca.crt") -}}
{{- $tlsCrt = index $existing.data "tls.crt" -}}
{{- $tlsKey = index $existing.data "tls.key" -}}
{{- $caCrt = index $existing.data "ca.crt" -}}
{{- else -}}
{{- $ca := genCA (printf "%s-ca" $name) (int .Values.tls.certValidityDays) -}}
{{- $dns := list
    (printf "%s" $name)
    (printf "%s.%s" $name .Release.Namespace)
    (printf "%s.%s.svc" $name .Release.Namespace)
    (printf "%s.%s.svc.cluster.local" $name .Release.Namespace)
-}}
{{- $cert := genSignedCert $name nil $dns (int .Values.tls.certValidityDays) $ca -}}
{{- $tlsCrt = $cert.Cert | b64enc -}}
{{- $tlsKey = $cert.Key | b64enc -}}
{{- $caCrt = $ca.Cert | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "iaas-network-provider.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCrt }}
  tls.key: {{ $tlsKey }}
  ca.crt: {{ $caCrt }}
{{- end }}
