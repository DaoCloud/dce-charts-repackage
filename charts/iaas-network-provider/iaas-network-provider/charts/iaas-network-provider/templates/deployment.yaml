apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iaas-network-provider.fullname" . }}
  labels:
    {{- include "iaas-network-provider.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "iaas-network-provider.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iaas-network-provider.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.prometheusAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ include "iaas-network-provider.httpsPort" . | quote }}
        prometheus.io/scheme: "https"
        {{- end }}
    spec:
      serviceAccountName: {{ include "iaas-network-provider.serviceAccountName" . }}
      {{- if .Values.controller.affinity }}
      affinity:
        {{- toYaml .Values.controller.affinity | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "iaas-network-provider.image" . | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - --config=/etc/iaas-network-provider/config.yaml
          ports:
            - name: https
              containerPort: {{ include "iaas-network-provider.httpsPort" . }}
              protocol: TCP
            {{- if .Values.controller.pprof.enabled }}
            - name: pprof
              containerPort: {{ include "iaas-network-provider.pprofPort" . }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /v1/apis/network.iaas.io/healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/apis/network.iaas.io/ready
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          env:
            {{- if eq .Values.cloud.auth.mode "ak-sk" }}
            - name: CLOUD_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloud.auth.secret }}
                  key: CLOUD_ACCESS_KEY
            - name: CLOUD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloud.auth.secret }}
                  key: CLOUD_SECRET_KEY
            {{- else }}
            - name: CLOUD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloud.auth.secret }}
                  key: CLOUD_PASSWORD
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/iaas-network-provider
              readOnly: true
            - name: tls
              mountPath: /etc/iaas-network-provider/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "iaas-network-provider.fullname" . }}
        - name: tls
          secret:
            secretName: {{ default (printf "%s-tls" (include "iaas-network-provider.fullname" .)) .Values.tls.existingSecret }}
