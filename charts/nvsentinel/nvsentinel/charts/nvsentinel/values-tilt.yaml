global:
  dryRun: false
  kubeVersion: 1.31.0
  imagePullSecrets:
    - name: global-pull-secret
  # simple-health-client (tilt/simple-health-client) is the injection path for
  # the e2e fault-injection helpers: a single Deployment that posts health
  # events naming arbitrary target nodes. It therefore needs the same cross-node
  # grant as the real cluster-scoped monitors. Its ServiceAccount and projected
  # token are defined in tilt/simple-health-client/deployment.yaml.
  platformConnectorAuth:
    # The bundled monitors are derived from the release namespace; only the
    # dev-only fault-injection client needs listing. Tilt always installs into
    # nvsentinel, so the literal namespace is accurate here.
    crossNodeServiceAccounts:
      - "system:serviceaccount:nvsentinel:simple-health-client"
  # NOTE: Datastore configuration is provided by:
  # - values-tilt-mongodb.yaml (default, when USE_POSTGRESQL is not set)
  # - values-tilt-postgresql.yaml (when USE_POSTGRESQL=1)
  # This ensures proper configuration for both database backends

  # Audit logging enabled for Tilt development
  auditLogging:
    enabled: true
    logRequestBody: false
    maxSizeMB: 100
    maxBackups: 3
    maxAgeDays: 7
    compress: true
  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}
  systemNodeSelector:
    node-role.kubernetes.io/control-plane: ""
  systemNodeTolerations:
    - operator: Exists
  gpuHealthMonitor:
    enabled: true
  healthEventsAnalyzer:
    enabled: true
  faultQuarantine:
    enabled: true
  nodeDrainer:
    enabled: true
  faultRemediation:
    enabled: true
  dcaHealthMonitor:
    enabled: false
  cspHealthMonitor:
    enabled: true
  syslogHealthMonitor:
    enabled: true
    xidSideCar:
      enabled: false
  inclusterFileServer:
    enabled: true
  janitor:
    enabled: true
  lifecycleManager:
    enabled: true
  janitorProvider:
    enabled: true
  mongodbStore:
    enabled: true
  metadataCollector:
    enabled: false
  kubernetesObjectMonitor:
    enabled: true
  nvcreCertificationMonitor:
    enabled: true
  slurmDrainMonitor:
    enabled: true
  nicHealthMonitor:
    enabled: true
  eventExporter:
    enabled: true
  preflight:
    enabled: true
  metricsPort: 2112
# Preflight subchart: use Tilt fake DCGM (nvidia-dcgm.gpu-operator.svc) and quick diag for faster E2E pass.
# Init containers (name, image, volumeMounts, env) are declared in charts/preflight/values.yaml; here we
# override to only inject preflight-dcgm-diag for Tilt (NCCL inits need real GPUs and would fail/hang).
preflight:
  gangDiscovery:
    name: "kai"
    annotationKeys:
      - "scheduling.run.ai/pod-group"
    labelKeys: []
    podGroupGVR:
      group: "scheduling.run.ai"
      version: "v2alpha2"
      resource: "podgroups"
    minCountExpr: "podGroup.spec.minMember"
  initContainers:
    - name: preflight-dcgm-diag
      image:
        repository: busybox
        tag: latest
      command: ["/bin/sh", "-c"]
      args: ["echo 'preflight-dcgm-diag: no real GPU, exiting ok'; exit 0"]
mongodb-store:
  useBitnami: true
  usePerconaOperator: false
  job:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - operator: Exists
  psmdb-operator:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - operator: Exists
  psmdb-db:
    nameOverride: mongodb
    fullnameOverride: mongodb
    replsets:
      rs0:
        name: rs0
        size: 3
        configuration: |
          replication:
            oplogSizeMB: 990
          setParameter:
            authenticationMechanisms: "MONGODB-X509,SCRAM-SHA-256,SCRAM-SHA-1"
        replsetOverrides:
          mongodb-rs0-0:
            priority: 3
          mongodb-rs0-1:
            priority: 1
          mongodb-rs0-2:
            priority: 1
        volumeSpec:
          pvc:
            resources:
              requests:
                # 2Gi is enough for Tilt Percona plus MongoDB's 990 MiB oplog floor.
                storage: "2Gi"
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""
        tolerations:
          - operator: Exists
        podDisruptionBudget:
          maxUnavailable: 1
    sharding:
      enabled: false
    logcollector:
      enabled: false
    tls:
      mode: requireTLS
    secrets:
      keyFile: mongodb-keyfile
      encryptionKey: mongodb-encryption-key
    backup:
      enabled: false
      storages: {}
      tasks: []
      volumeMounts: []
    finalizers: []
  psmdb:
    helperImages:
      kubectl:
        repository: docker.m.daocloud.io/lachlanevenson/k8s-kubectl
        tag: "v1.25.4"
        pullPolicy: IfNotPresent
      mongosh:
        repository: ghcr.m.daocloud.io/rtsp/docker-mongosh
        tag: "2.5.2"
        pullPolicy: IfNotPresent
  # Bitnami MongoDB configuration
  mongodb:
    replicaCount: 1
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - operator: Exists
    jobTolerations:
      - operator: Exists
    image:
      registry: "docker.m.daocloud.io"
      repository: "bitnamilegacy/mongodb"
      tag: "8.0.3-debian-12-r1"
      pullPolicy: "IfNotPresent"
    tls:
      replicaset:
        existingSecrets:
          - "mongo-server-cert-0"
      image:
        registry: "docker.m.daocloud.io"
        repository: "bitnamilegacy/nginx"
        tag: "1.27.2-debian-12-r2"
        pullPolicy: "IfNotPresent"
    metrics:
      enabled: true
      image:
        registry: docker.m.daocloud.io
        repository: bitnamilegacy/mongodb-exporter
        tag: 0.41.2-debian-12-r1
# Subchart-specific configuration for incluster-file-server
incluster-file-server:
  # Disable log cleanup in Tilt - the cleanup image may not be available
  logCleanup:
    enabled: false
# Subchart-specific configuration for gpu-health-monitor
gpu-health-monitor:
  dcgmFieldsMonitoring:
    gpuTempLimitStoreOnly: false
# Override log levels for all modules during testing
fault-quarantine:
  logLevel: debug
  validation:
    enabled: true
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: kwok
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          topologyKey: kubernetes.io/hostname
fault-remediation:
  replicaCount: 1
  logLevel: debug
  # Multi-template maintenance resource configuration for E2E tests
  maintenance:
    actions:
      "COMPONENT_RESET": # Action 2
        apiGroup: "janitor.dgxc.nvidia.com"
        version: "v1alpha1"
        kind: "GPUReset"
        scope: "Cluster"
        completeConditionType: "Complete"
        templateFileName: "gpureset-template.yaml"
        equivalenceGroup: "reset"
        supersedingEquivalenceGroups: ["restart"]
        impactedEntityScope: "GPU_UUID"
      "RESTART_VM": # Action 15
        apiGroup: "janitor.dgxc.nvidia.com"
        version: "v1alpha1"
        kind: "RebootNode"
        scope: "Cluster"
        completeConditionType: "NodeReady"
        templateFileName: "rebootnode-template.yaml"
        equivalenceGroup: "restart"
      "RESTART_BM": # Action 24
        apiGroup: "janitor.dgxc.nvidia.com"
        version: "v1alpha1"
        kind: "RebootNode"
        scope: "Cluster"
        completeConditionType: "NodeReady"
        templateFileName: "rebootnode-template.yaml"
        equivalenceGroup: "restart"
    templates:
      "gpureset-template.yaml": |
        apiVersion: {{.ApiGroup}}/{{.Version}}
        kind: GPUReset
        metadata:
          name: maintenance-{{ .HealthEvent.NodeName }}-{{ .HealthEventID }}
          labels:
            app.kubernetes.io/managed-by: nvsentinel
        spec:
          nodeName: {{ .HealthEvent.NodeName }}
          selector:
            uuids:
              - {{ .ImpactedEntityScopeValue }}
      "rebootnode-template.yaml": |
        apiVersion: {{ .ApiGroup }}/{{ .Version }}
        kind: RebootNode
        metadata:
          name: maintenance-{{ .HealthEvent.NodeName }}-{{ .HealthEventID }}
          labels:
            app.kubernetes.io/managed-by: nvsentinel
          annotations:
            nvsentinel.nvidia.com/ttl: "336h"
        spec:
          nodeName: {{ .HealthEvent.NodeName }}
  logCollector:
    enabled: true
    image:
      repository: localhost:5001/ghcr.io_nvidia_nvsentinel_log-collector
      tag: latest
      pullPolicy: Always
    timeout: "10s" # Short timeout for faster testing (production default: "10m")
    env:
      MOCK_MODE: "true"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: kwok
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          topologyKey: kubernetes.io/hostname
node-drainer:
  logLevel: debug
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: kwok
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          topologyKey: kubernetes.io/hostname
  partialDrainEnabled: true
health-events-analyzer:
  logLevel: debug
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: kwok
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          topologyKey: kubernetes.io/hostname
  config: "[[rules]]\nname = \"MultipleRemediations\"\n# Keep this wider than two full remediation cycles in CI. A 120s window\n# flakes when each reboot takes ~70-90s (see #1458).\ndescription = \"Detect if multiple remediations are performed within 10 minutes on a node (test config)\"\nrecommended_action = \"CONTACT_SUPPORT\"\nevaluate_rule = true\nstage = [\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\n            \"$gte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              {\"$subtract\": [\"this.healthevent.generatedtimestamp.seconds\", 600]}\n            ]\n          },\n          {\n            \"$lte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              \"this.healthevent.generatedtimestamp.seconds\"\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"healtheventstatus.faultremediated.value\": true,\n      \"healthevent.nodename\": \"this.healthevent.nodename\",\n      \"healthevent.isfatal\": \"this.healthevent.isfatal\"\n    }\n  }\n  ''',\n  '{\"$count\": \"count\"}',\n  '{\"$match\": {\"count\": {\"$gte\": 2}}}'\n]\n\n[[rules]]\nname = \"RepeatedXIDErrorOnSameGPU\"\ndescription = \"Detect occurrence of XID errors (any XID except 31 and 45) on the same GPU 2 times within 2 minutes where the burst window is 15 seconds and sticky XIDs window is 30 seconds (test config)\"\nrecommended_action = \"CONTACT_SUPPORT\"\nevaluate_rule = true\nstage = [\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\n            \"$gte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              {\"$subtract\": [\"this.healthevent.generatedtimestamp.seconds\", 120]}\n            ]\n          },\n          {\n            \"$lte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              \"this.healthevent.generatedtimestamp.seconds\"\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  # Gate current event: only XID events carry GPU_UUID entities; without\n  # this guard, non-GPU events (e.g. NIC diagnostics) would reach the\n  # $setIntersection stage below and hit \"$size on null\".\n   '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\"$eq\": [\"this.healthevent.checkname\", \"SysLogsXIDError\"]},\n          {\n            \"$ne\": [\n              \"this.healthevent.errorcode.0\",\n              \"31\"\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  # Candidate docs must also be XID events so non-XID unhealthy events on\n  # the same node are not merged into GPU burst counts.\n  #\n  # Excluded codes: 31 has its own dedicated rules; 45 is preemptive channel cleanup that\n  # the Xid catalogue resolves as \"Not Solo: IGNORE (follow other Xid)\", and a repeat is\n  # never solo.\n  '''\n  {\n    \"$match\": {\n    \"healthevent.checkname\": \"SysLogsXIDError\",\n      \"healthevent.ishealthy\": false,\n      \"healthevent.nodename\": \"this.healthevent.nodename\",\n      \"$expr\": {\n      \"$and\": [\n        {\"$not\": [{\"$in\": [{\"$arrayElemAt\": [\"$healthevent.errorcode\", 0]}, [\"31\", \"45\"]]}]},\n        {\n          \"$gt\": [\n            {\n              \"$size\": {\n                \"$setIntersection\": [\n                  {\n                    \"$map\": {\n                      \"input\": {\n                        \"$filter\": {\n                          \"input\": {\"$ifNull\": [\"$healthevent.entitiesimpacted\", []]},\n                          \"cond\": {\"$eq\": [\"$$this.entitytype\", \"GPU_UUID\"]}\n                        }\n                      },\n                      \"in\": \"$$this.entityvalue\"\n                    }\n                  },\n                  {\n                    \"$map\": {\n                      \"input\": {\n                        \"$filter\": {\n                          \"input\": \"this.healthevent.entitiesimpacted\",\n                          \"cond\": {\"$eq\": [\"$$this.entitytype\", \"GPU_UUID\"]}\n                        }\n                      },\n                      \"in\": \"$$this.entityvalue\"\n                    }\n                  }\n                ]\n              }\n            },\n            0\n          ]\n        }\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$setWindowFields\": {\n      \"sortBy\": {\"healthevent.generatedtimestamp.seconds\": 1},\n      \"output\": {\n        \"prevTimestamp\": {\n          \"$shift\": {\n            \"output\": \"$healthevent.generatedtimestamp.seconds\",\n            \"by\": -1\n          }\n        }\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$addFields\": {\n      \"isStickyXid\": {\n        \"$in\": [\n          {\"$arrayElemAt\": [\"$healthevent.errorcode\", 0]},\n          [\"74\", \"79\", \"95\", \"109\", \"119\"]\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$setWindowFields\": {\n      \"sortBy\": {\"healthevent.generatedtimestamp.seconds\": 1},\n      \"output\": {\n        \"allPreviousEvents\": {\n          \"$push\": \"$$ROOT\",\n          \"window\": {\"documents\": [\"unbounded\", -1]}\n        }\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$addFields\": {\n      \"stickyXidWithin3Hours\": {\n        \"$cond\": {\n          \"if\": \"$isStickyXid\",\n          \"then\": {\n            \"$anyElementTrue\": {\n              \"$map\": {\n                \"input\": \"$allPreviousEvents\",\n                \"as\": \"prevEvent\",\n                \"in\": {\n                  \"$and\": [\n                    {\n                      \"$in\": [\n                        {\"$arrayElemAt\": [\"$$prevEvent.healthevent.errorcode\", 0]},\n                        [\"74\", \"79\", \"95\", \"109\", \"119\"]\n                      ]\n                    },\n                    {\"$lte\": [{\"$subtract\": [\"$healthevent.generatedtimestamp.seconds\", \"$$prevEvent.healthevent.generatedtimestamp.seconds\"]}, 30]}\n                  ]\n                }\n              }\n            }\n          },\n          \"else\": false\n        }\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$setWindowFields\": {\n      \"sortBy\": {\"healthevent.generatedtimestamp.seconds\": 1},\n      \"output\": {\n        \"burstId\": {\n          \"$sum\": {\n            \"$cond\": {\n              \"if\": {\"$eq\": [\"$prevTimestamp\", null]},\n              \"then\": 1,\n              \"else\": {\n                \"$cond\": {\n                  \"if\": {\n                    \"$and\": [\n                      \"$isStickyXid\",\n                      \"$stickyXidWithin3Hours\"\n                    ]\n                  },\n                  \"then\": 0,\n                  \"else\": {\n                    \"$cond\": {\n                      \"if\": {\"$gt\": [{\"$subtract\": [\"$healthevent.generatedtimestamp.seconds\", \"$prevTimestamp\"]}, 15]},\n                      \"then\": 1,\n                      \"else\": 0\n                    }\n                  }\n                }\n              }\n            }\n          },\n          \"window\": {\"documents\": [\"unbounded\", \"current\"]}\n        }\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$group\": {\n      \"_id\": {\"burstId\": \"$burstId\"},\n      \"uniqueXidsInBurst\": {\"$addToSet\": {\"$arrayElemAt\": [\"$healthevent.errorcode\", 0]}},\n      \"targetXidCount\": {\n        \"$sum\": {\n          \"$cond\": [\n            {\"$eq\": [{\"$arrayElemAt\": [\"$healthevent.errorcode\", 0]}, \"this.healthevent.errorcode.0\"]},\n            1,\n            0\n          ]\n        }\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$setWindowFields\": {\n      \"sortBy\": {\"_id.burstId\": 1},\n      \"output\": {\"maxBurstId\": {\"$max\": \"$_id.burstId\"}}\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\"$in\": [\"this.healthevent.errorcode.0\", \"$uniqueXidsInBurst\"]},\n          {\n            \"$or\": [\n              {\"$ne\": [\"$_id.burstId\", \"$maxBurstId\"]},\n              {\"$eq\": [\"$targetXidCount\", 1]}\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$group\": {\n      \"_id\": null,\n      \"count\": {\"$sum\": 1},\n      \"bursts\": {\"$push\": {\"burstId\": \"$_id.burstId\", \"uniqueXids\": \"$uniqueXidsInBurst\"}}\n    }\n  }\n  ''',\n  '''\n  {\n  \"$match\": {\n      \"$expr\": {\n      \"$gte\": [\n          \"$count\", 2\n        ]\n      }\n  }\n  }\n  '''\n]\n\n[[rules]]\nname = \"RepeatedXID31OnSameGPU\"\ndescription = \"Detect if XID 31 occurred 2 or more times on the same GPU within 2 minutes where the burst window is 15 seconds and sticky XIDs window is 30 seconds (test config)\"\nrecommended_action = \"RUN_DCGMEUD\"\nmessage = \"if DCGM EUD tests pass, run field diagnostics\"\nevaluate_rule = true\nstage = [\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\n            \"$gte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              {\"$subtract\": [\"this.healthevent.generatedtimestamp.seconds\", 120]}\n            ]\n          },\n          {\n            \"$lte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              \"this.healthevent.generatedtimestamp.seconds\"\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n    \"$expr\": {\n        \"$eq\": [\n          \"this.healthevent.errorcode.0\",\n          \"31\"\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"healthevent.ishealthy\": false,\n      \"healthevent.nodename\": \"this.healthevent.nodename\",\n      \"$expr\": {\n        \"$gt\": [\n          {\n            \"$size\": {\n              \"$setIntersection\": [\n                {\n                  \"$map\": {\n                    \"input\": {\n         