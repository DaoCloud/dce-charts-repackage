hin 1.5 minutes\"\nrecommended_action = \"CONTACT_SUPPORT\"\nmessage = \"bit 18 is set in register 3, reset of fabric is required\"\nevaluate_rule = true\nstage = [\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\n            \"$gte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              {\"$subtract\": [\"this.healthevent.generatedtimestamp.seconds\", 90]}\n            ]\n          },\n          {\n            \"$lte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              \"this.healthevent.generatedtimestamp.seconds\"\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$eq\": [\n          \"this.healthevent.errorcode.0\",\n          \"74\"\n        ]\n      }\n    }\n  }\n  ''',\n '''\n  {\n    \"$addFields\": {\n      \"registers\": {\n        \"$arrayToObject\": {\n          \"$map\": {\n            \"input\": {\n              \"$filter\": {\n                \"input\": \"$healthevent.entitiesimpacted\",\n                \"cond\": {\n                  \"$in\": [\"$$this.entitytype\", [\"REG0\", \"REG1\", \"REG2\", \"REG3\", \"REG4\", \"REG5\", \"REG6\"]]\n                }\n              }\n            },\n            \"as\": \"reg\",\n            \"in\": {\n              \"k\": \"$$reg.entitytype\",\n              \"v\": \"$$reg.entityvalue\"\n            }\n          }\n        }\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\"$eq\": [\"$registers.REG0\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG1\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG2\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG3\", \"00000000000001000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG4\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG5\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG6\", \"00000000000000000000000000000000\"]}\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$lookup\": {\n      \"from\": \"HealthEvents\",\n      \"let\": {\n        \"currentEventId\": \"$_id\",\n        \"currentNodeName\": \"$healthevent.nodename\",\n        \"gpuUuid\": {\n          \"$arrayElemAt\": [\n            {\n              \"$map\": {\n                \"input\": {\n                  \"$filter\": {\n                    \"input\": {\"$ifNull\": [\"$healthevent.entitiesimpacted\", []]},\n                    \"cond\": {\"$eq\": [\"$$this.entitytype\", \"GPU_UUID\"]}\n                  }\n                },\n                \"in\": \"$$this.entityvalue\"\n              }\n            },\n            0\n          ]\n        }\n      },\n      \"pipeline\": [\n        {\n          \"$match\": {\n            \"$expr\": {\n              \"$and\": [\n                {\n                  \"$gte\": [\n                    \"$healthevent.generatedtimestamp.seconds\",\n                    {\"$subtract\": [{\"$divide\": [{\"$toLong\": \"$$NOW\"}, 1000]}, 90]}\n                  ]\n                },\n                {\"$ne\": [\"$_id\", \"$$currentEventId\"]},\n                {\"$eq\": [\"$healthevent.nodename\", \"$$currentNodeName\"]},\n                {\"$ne\": [{\"$arrayElemAt\": [\"$healthevent.errorcode\", 0]}, \"74\"]},\n                {\n                  \"$gt\": [\n                    {\n                      \"$size\": {\n                        \"$filter\": {\n                          \"input\": {\"$ifNull\": [\"$healthevent.entitiesimpacted\", []]},\n                          \"cond\": {\n                            \"$and\": [\n                              {\"$eq\": [\"$$this.entitytype\", \"GPU_UUID\"]},\n                              {\"$eq\": [\"$$this.entityvalue\", \"$$gpuUuid\"]}\n                            ]\n                          }\n                        }\n                      }\n                    },\n                    0\n                  ]\n                }\n              ]\n            }\n          }\n        },\n        {\n          \"$sort\": {\n            \"healthevent.generatedtimestamp.seconds\": -1\n          }\n        },\n        {\n          \"$group\": {\n            \"_id\": {\n              \"$arrayElemAt\": [\"$healthevent.errorcode\", 0]\n            },\n            \"mostRecentEvent\": {\n              \"$first\": {\n                \"id\": \"$_id\",\n                \"isHealthy\": {\"$ifNull\": [\"$healthevent.ishealthy\", false]},\n                \"timestamp\": \"$healthevent.generatedtimestamp.seconds\"\n              }\n            }\n          }\n        },\n        {\n          \"$match\": {\n            \"mostRecentEvent.isHealthy\": false\n          }\n        }\n      ],\n      \"as\": \"otherXidEvents\"\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$eq\": [{\"$size\": \"$otherXidEvents\"}, 0]\n      }\n    }\n  }\n  '''\n]\n\n[[rules]]\nname = \"XID74Reg4HardwareIssue\"\ndescription = \"Detect if XID 74 with register 4 bits (18, 19, 21, 22, 24, 25, 27, 28) set occurred 2 or more times on same NVLink and GPU within 1.5 minutes\"\nrecommended_action = \"CONTACT_SUPPORT\"\nmessage = \"one of the bits (18, 19, 21, 22, 24, 25, 27, 28) is set in register 4 and its repeating on same NVLink, likely a HW issue with ECC/Parity\"\nevaluate_rule = true\nstage = [\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\n            \"$gte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              {\"$subtract\": [\"this.healthevent.generatedtimestamp.seconds\", 90]}\n            ]\n          },\n          {\n            \"$lte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              \"this.healthevent.generatedtimestamp.seconds\"\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$eq\": [\n          \"this.healthevent.errorcode.0\",\n          \"74\"\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"healthevent.ishealthy\": false,\n      \"healthevent.nodename\": \"this.healthevent.nodename\",\n      \"$expr\": {\n        \"$gt\": [\n          {\n            \"$size\": {\n              \"$setIntersection\": [\n                {\n                  \"$map\": {\n                    \"input\": {\n                      \"$filter\": {\n                        \"input\": {\"$ifNull\": [\"$healthevent.entitiesimpacted\", []]},\n                        \"cond\": {\"$eq\": [\"$$this.entitytype\", \"GPU_UUID\"]}\n                      }\n                    },\n                    \"in\": \"$$this.entityvalue\"\n                  }\n                },\n                {\n                  \"$map\": {\n                    \"input\": {\n                      \"$filter\": {\n                        \"input\": \"this.healthevent.entitiesimpacted\",\n                        \"cond\": {\"$eq\": [\"$$this.entitytype\", \"GPU_UUID\"]}\n                      }\n                    },\n                    \"in\": \"$$this.entityvalue\"\n                  }\n                }\n              ]\n            }\n          },\n          0\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$addFields\": {\n      \"registers\": {\n        \"$arrayToObject\": {\n          \"$map\": {\n            \"input\": {\n              \"$filter\": {\n                \"input\": \"$healthevent.entitiesimpacted\",\n                \"cond\": {\n                  \"$in\": [\"$$this.entitytype\", [\"REG0\", \"REG1\", \"REG2\", \"REG3\", \"REG4\", \"REG5\", \"REG6\"]]\n                }\n              }\n            },\n            \"as\": \"reg\",\n            \"in\": {\n              \"k\": \"$$reg.entitytype\",\n              \"v\": \"$$reg.entityvalue\"\n            }\n          }\n        }\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\n            \"$or\": [\n              {\"$eq\": [\"$registers.REG4\", \"00000000000001000000000000000000\"]},\n              {\"$eq\": [\"$registers.REG4\", \"00000000000010000000000000000000\"]},\n              {\"$eq\": [\"$registers.REG4\", \"00000000001000000000000000000000\"]},\n              {\"$eq\": [\"$registers.REG4\", \"00000000010000000000000000000000\"]},\n              {\"$eq\": [\"$registers.REG4\", \"00000001000000000000000000000000\"]},\n              {\"$eq\": [\"$registers.REG4\", \"00000010000000000000000000000000\"]},\n              {\"$eq\": [\"$registers.REG4\", \"00001000000000000000000000000000\"]},\n              {\"$eq\": [\"$registers.REG4\", \"00010000000000000000000000000000\"]}\n            ]\n          },\n          {\"$eq\": [\"$registers.REG0\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG1\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG2\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG3\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG5\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG6\", \"00000000000000000000000000000000\"]}\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$addFields\": {\n      \"nvlinkValue\": {\n        \"$arrayElemAt\": [\n          {\n            \"$map\": {\n              \"input\": {\"$filter\": {\"input\": {\"$ifNull\": [\"$healthevent.entitiesimpacted\", []]}, \"cond\": {\"$eq\": [\"$$this.entitytype\", \"NVLINK\"]}}},\n              \"in\": \"$$this.entityvalue\"\n            }\n          },\n          0\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$eq\": [\n          \"$nvlinkValue\",\n          {\n            \"$arrayElemAt\": [\n              {\n                \"$map\": {\n                  \"input\": {\"$filter\": {\"input\": \"this.healthevent.entitiesimpacted\", \"cond\": {\"$eq\": [\"$$this.entitytype\", \"NVLINK\"]}}},\n                  \"in\": \"$$this.entityvalue\"\n                }\n              },\n              0\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '{\"$count\": \"count\"}',\n  '{\"$match\": {\"count\": {\"$gte\": 2}}}'\n]\n\n[[rules]]\nname = \"XID74Reg4ECCError\"\ndescription = \"Detect if XID 74 with register 4 bits (20, 23, 26, 29) set occurred 2 or more times on same NVLink and GPU within 1.5 minutes\"\nrecommended_action = \"NONE\"\nmessage = \"one of the bits (20, 23, 26, 29) is set in register 4, request for field diagnosis if user jobs are interrupted or error occurs repeatedly\"\nevaluate_rule = true\nstage = [\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\n            \"$gte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              {\"$subtract\": [\"this.healthevent.generatedtimestamp.seconds\", 90]}\n            ]\n          },\n          {\n            \"$lte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              \"this.healthevent.generatedtimestamp.seconds\"\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$eq\": [\n          \"this.healthevent.errorcode.0\",\n          \"74\"\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"healthevent.ishealthy\": false,\n      \"healthevent.nodename\": \"this.healthevent.nodename\",\n      \"$expr\": {\n        \"$gt\": [\n          {\n            \"$size\": {\n              \"$setIntersection\": [\n                {\n                  \"$map\": {\n                    \"input\": {\n                      \"$filter\": {\n                        \"input\": {\"$ifNull\": [\"$healthevent.entitiesimpacted\", []]},\n                        \"cond\": {\"$eq\": [\"$$this.entitytype\", \"GPU_UUID\"]}\n                      }\n                    },\n                    \"in\": \"$$this.entityvalue\"\n                  }\n                },\n                {\n                  \"$map\": {\n                    \"input\": {\n                      \"$filter\": {\n                        \"input\": \"this.healthevent.entitiesimpacted\",\n                        \"cond\": {\"$eq\": [\"$$this.entitytype\", \"GPU_UUID\"]}\n                      }\n                    },\n                    \"in\": \"$$this.entityvalue\"\n                  }\n                }\n              ]\n            }\n          },\n          0\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$addFields\": {\n      \"registers\": {\n        \"$arrayToObject\": {\n          \"$map\": {\n            \"input\": {\n              \"$filter\": {\n                \"input\": \"$healthevent.entitiesimpacted\",\n                \"cond\": {\n                  \"$in\": [\"$$this.entitytype\", [\"REG0\", \"REG1\", \"REG2\", \"REG3\", \"REG4\", \"REG5\", \"REG6\"]]\n                }\n              }\n            },\n            \"as\": \"reg\",\n            \"in\": {\n              \"k\": \"$$reg.entitytype\",\n              \"v\": \"$$reg.entityvalue\"\n            }\n          }\n        }\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\n            \"$or\": [\n              {\"$eq\": [\"$registers.REG4\", \"00000000000100000000000000000000\"]},\n              {\"$eq\": [\"$registers.REG4\", \"00000000100000000000000000000000\"]},\n              {\"$eq\": [\"$registers.REG4\", \"00000100000000000000000000000000\"]},\n              {\"$eq\": [\"$registers.REG4\", \"00100000000000000000000000000000\"]}\n            ]\n          },\n          {\"$eq\": [\"$registers.REG0\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG1\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG2\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG3\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG5\", \"00000000000000000000000000000000\"]},\n          {\"$eq\": [\"$registers.REG6\", \"00000000000000000000000000000000\"]}\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$addFields\": {\n      \"nvlinkValue\": {\n        \"$arrayElemAt\": [\n          {\n            \"$map\": {\n              \"input\": {\"$filter\": {\"input\": {\"$ifNull\": [\"$healthevent.entitiesimpacted\", []]}, \"cond\": {\"$eq\": [\"$$this.entitytype\", \"NVLINK\"]}}},\n              \"in\": \"$$this.entityvalue\"\n            }\n          },\n          0\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$eq\": [\n          \"$nvlinkValue\",\n          {\n            \"$arrayElemAt\": [\n              {\n                \"$map\": {\n                  \"input\": {\"$filter\": {\"input\": \"this.healthevent.entitiesimpacted\", \"cond\": {\"$eq\": [\"$$this.entitytype\", \"NVLINK\"]}}},\n                  \"in\": \"$$this.entityvalue\"\n                }\n              },\n              0\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '{\"$count\": \"count\"}',\n  '{\"$match\": {\"count\": {\"$gte\": 2}}}'\n]\n\n[[rules]]\nname = \"RepeatedNICDriverError\"\ndescription = \"Detect if a selected non-fatal NIC driver kernel-log pattern occurs 3 or more times on the same node within 2 minutes (test config)\"\nrecommended_action = \"CONTACT_SUPPORT\"\nmessage = \"Repeated non-fatal NIC driver kernel-log error of the same type on this node - auto-recovery is failing or hardware is unstable; investigate driver, firmware, cooling, power, or cabling\"\nevaluate_rule = true\nstage = [\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\n            \"$gte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              {\"$subtract\": [\"this.healthevent.generatedtimestamp.seconds\", 120]}\n            ]\n          },\n          {\n            \"$lte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              \"this.healthevent.generatedtimestamp.seconds\"\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\"$eq\": [\"this.healthevent.agent\", \"syslog-health-monitor\"]},\n          {\"$eq\": [\"this.healthevent.checkname\", \"SysLogsNICDriverError\"]},\n          {\"$eq\": [\"this.healthevent.isfatal\", false]},\n          {\"$eq\": [\"this.healthevent.ishealthy\", false]},\n          {\n            \"$in\": [\n              \"this.healthevent.errorcode.0\",\n              [\"netdev_watchdog\", \"port_module_high_temp\", \"pci_power_insufficient\", \"module_unplugged\", \"mlx5_tx_timeout_detected\", \"mlx5_rx_timeout_detected\"]\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"healthevent.agent\": \"syslog-health-monitor\",\n      \"healthevent.checkname\": \"SysLogsNICDriverError\",\n      \"healthevent.isfatal\": false,\n      \"healthevent.ishealthy\": false,\n      \"healthevent.nodename\": \"this.healthevent.nodename\",\n      \"$expr\": {\n        \"$eq\": [\n          {\"$arrayElemAt\": [\"$healthevent.errorcode\", 0]},\n          \"this.healthevent.errorcode.0\"\n        ]\n      }\n    }\n  }\n  ''',\n  '{\"$count\": \"count\"}',\n  '{\"$match\": {\"count\": {\"$gte\": 3}}}'\n]\n\n[[rules]]\nname = \"RepeatedNICDegradation\"\ndescription = \"Detect if non-fatal NIC counter degradation events occur 3 or more times on the same NIC port within 2 minutes (test config)\"\nrecommended_action = \"CONTACT_SUPPORT\"\nmessage = \"Repeated non-fatal NIC port degradation on the same port - counter has cleared and re-tripped, or multiple non-fatal counters are degrading; investigate physical layer, cable, optics, or adapter\"\nevaluate_rule = true\nstage = [\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\n            \"$gte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              {\"$subtract\": [\"this.healthevent.generatedtimestamp.seconds\", 120]}\n            ]\n          },\n          {\n            \"$lte\": [\n              \"$healthevent.generatedtimestamp.seconds\",\n              \"this.healthevent.generatedtimestamp.seconds\"\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\"$eq\": [\"this.healthevent.agent\", \"nic-health-monitor\"]},\n          {\"$eq\": [\"this.healthevent.isfatal\", false]},\n          {\"$eq\": [\"this.healthevent.ishealthy\", false]},\n          {\n            \"$in\": [\n              \"this.healthevent.checkname\",\n              [\"InfiniBandDegradationCheck\", \"EthernetDegradationCheck\"]\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"healthevent.agent\": \"nic-health-monitor\",\n      \"healthevent.checkname\": {\"$in\": [\"InfiniBandDegradationCheck\", \"EthernetDegradationCheck\"]},\n      \"healthevent.isfatal\": false,\n      \"healthevent.ishealthy\": false,\n      \"healthevent.nodename\": \"this.healthevent.nodename\"\n    }\n  }\n  ''',\n  '''\n  {\n    \"$addFields\": {\n      \"nicValue\": {\n        \"$arrayElemAt\": [\n          {\n            \"$map\": {\n              \"input\": {\n                \"$filter\": {\n                  \"input\": {\"$ifNull\": [\"$healthevent.entitiesimpacted\", []]},\n                  \"cond\": {\"$eq\": [\"$$this.entitytype\", \"NIC\"]}\n                }\n              },\n              \"in\": \"$$this.entityvalue\"\n            }\n          },\n          0\n        ]\n      },\n      \"nicPortValue\": {\n        \"$arrayElemAt\": [\n          {\n            \"$map\": {\n              \"input\": {\n                \"$filter\": {\n                  \"input\": {\"$ifNull\": [\"$healthevent.entitiesimpacted\", []]},\n                  \"cond\": {\"$eq\": [\"$$this.entitytype\", \"NICPort\"]}\n                }\n              },\n              \"in\": \"$$this.entityvalue\"\n            }\n          },\n          0\n        ]\n      }\n    }\n  }\n  ''',\n  '''\n  {\n    \"$match\": {\n      \"$expr\": {\n        \"$and\": [\n          {\"$ne\": [\"$nicValue\", null]},\n          {\"$ne\": [\"$nicPortValue\", null]},\n          {\n            \"$eq\": [\n              \"$nicValue\",\n              {\n                \"$arrayElemAt\": [\n                  {\n                    \"$map\": {\n                      \"input\": {\n                        \"$filter\": {\n                          \"input\": \"this.healthevent.entitiesimpacted\",\n                          \"cond\": {\"$eq\": [\"$$this.entitytype\", \"NIC\"]}\n                        }\n                      },\n                      \"in\": \"$$this.entityvalue\"\n                    }\n                  },\n                  0\n                ]\n              }\n            ]\n          },\n          {\n            \"$eq\": [\n              \"$nicPortValue\",\n              {\n                \"$arrayElemAt\": [\n                  {\n                    \"$map\": {\n                      \"input\": {\n                        \"$filter\": {\n                          \"input\": \"this.healthevent.entitiesimpacted\",\n                          \"cond\": {\"$eq\": [\"$$this.entitytype\", \"NICPort\"]}\n                        }\n                      },\n                      \"in\": \"$$this.entityvalue\"\n                    }\n                  },\n                  0\n                ]\n              }\n            ]\n          }\n        ]\n      }\n    }\n  }\n  ''',\n  '{\"$count\": \"count\"}',\n  '{\"$match\": {\"count\": {\"$gte\": 3}}}'\n]\n"
janitor:
  config:
    # Derived from the release namespace; no need to pin it.
    cspProvider:
      tls:
        enabled: true
        caSecretName: "janitor-provider-grpc-cert"
      auth:
        enabled: true
        audience: "nvsentinel-csp-provider"
    controllers:
      gpuReset:
        enabled: true
        timeout: "25m"
        serviceManager:
          name: "gpu-operator"
          spec:
            namespace: "gpu-operator"
            teardownTimeout: "5m"
            restoreTimeout: "10m"
            managerSelector:
              app.kubernetes.io/managed-by: "tilt"
            apps:
              - appSelector:
                  app: "nvidia-dcgm"
                nodeLabel: "nvidia.com/gpu.deploy.dcgm"
                enabledValue: "true"
                disabledValue: "false"
        resetJob:
          writeSysLogEvent: false
          runtimeClassName: ""
          image:
            repository: "m.daocloud.io/public.ecr.aws/docker/library/alpine"
            tag: "latest"
            imagePullSecrets:
              - name: pull-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
  webhook:
    certIssuer: "janitor-selfsigned-issuer"
janitorProvider:
  csp: kind
  tls:
    enabled: true
  auth:
    enabled: true
janitor-provider:
  tls:
    enabled: true
  auth:
    # The bundled janitor is derived from the release namespace, so nothing is
    # needed here. List only an out-of-tree janitor, if you run one.
    allowedUsernames: []
labeler:
  logLevel: debug
  # Test kata label override with the annotation present on kata test nodes
  # Uncomment to test custom kata detection:
  # kataLabelOverride: "io.katacontainers.config.runtime.oci_runtime"
syslog-health-monitor:
  enabledChecks:
    - SysLogsXIDError
    - SysLogsSXIDError
    - SysLogsGPUFallenOff
    # Tilt-only: production defaults intentionally leave SysLogsNICDriverError
    # disabled. Enable it here so e2e tests can exercise NIC driver syslog detection.
    - SysLogsNICDriverError
  # Tilt-only overrides: the production chart enables only the mlx5 timeout
  # patterns and the soft-lockup pattern (the latter in STORE_ONLY shadow
  # mode). Tilt enables every pattern with EXECUTE_REMEDIATION so e2e tests
  # can exercise detection and the quarantine path end to end. The regexes,
  # severities, and actions are owned by code.
  nicDriverDetection:
    patterns:
      - name: cmd_exec_timeout
        enabled: true
        processingStrategy: EXECUTE_REMEDIATION
      - name: health_poll_failed
        enabled: true
        processingStrategy: EXECUTE_REMEDIATION
      - name: unrecoverable_err
        enabled: true
        processingStrategy: EXECUTE_REMEDIATION
      - name: netdev_watchdog
        enabled: true
        processingStrategy: EXECUTE_REMEDIATION
      - name: pci_power_insufficient
        enabled: true
        processingStrategy: EXECUTE_REMEDIATION
      - name: port_module_high_temp
        enabled: true
        processingStrategy: EXECUTE_REMEDIATION
      - name: access_reg_failed
        enabled: true
        processingStrategy: EXECUTE_REMEDIATION
      - name: module_unplugged
        enabled: true
        processingStrategy: EXECUTE_REMEDIATION
      - name: mlx5_tx_timeout_detected
        enabled: true
        processingStrategy: EXECUTE_REMEDIATION
      - name: mlx5_rx_timeout_detected
        enabled: true
        processingStrategy: EXECUTE_REMEDIATION
      - name: mlx5_napi_soft_lockup
        enabled: true
        processingStrategy: EXECUTE_REMEDIATION
csp-health-monitor:
  logLevel: debug
  cspName: "gcp" # this will be updated to aws as well dynamically during tests 
  quarantineTriggerEngine:
    logLevel: debug
  configToml:
    clusterName: "nvsentinel"
    maintenanceEventPollIntervalSeconds: 30
    postMaintenanceHealthyDelayMinutes: 1
    gcp:
      endpointOverride: "csp-api-mock.nvsentinel.svc.cluster.local:50051"
    aws:
      endpointOverride: "http://csp-api-mock.nvsentinel.svc.cluster.local:8080/aws/health"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: kwok
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          topologyKey: kubernetes.io/hostname
# Enable node metadata enrichment for testing
platformConnector:
  k8sConnector:
    enabled: true
    maxNodeConditionMessageLength: 1024
    compactedHealthEventMsgLen: 72
    qps: 5.0
    burst: 10
  dedup:
    enabled: true
    suppressionWindow: "3m"
    cleanupInterval: "60s"
    # Tilt keeps platform-connector dedup scoped to the dedicated E2E check so
    # syslog and health-events-analyzer tests can still exercise repeated XID/SXID flows.
    includeChecks:
      - PlatformConnectorDedupTestXIDError
  pipeline:
    - name: MetadataAugmentor
      enabled: true
      config: /etc/config/metadata.toml
    - name: OverrideTransformer
      enabled: true
      config: /etc/config/overrides.toml
  transformers:
    MetadataAugmentor:
      cacheSize: 50
      cacheTTLSeconds: 60
      # Must match commons/pkg/managed.ManagedLabelKey and ManagedLabelValueFalse.
      skipNodeLabel: "nvsentinel.dgxc.nvidia.com/managed=false"
      allowedLabels:
        - "topology.kubernetes.io/zone"
        - "topology.kubernetes.io/region"
    OverrideTransformer:
      rules:
        - name: "escalate-xid-94"
          when: 'event.agent == "syslog-health-monitor" && "94" in event.errorCode'
          override:
            isFatal: true
            recommendedAction: "CONTACT_SUPPORT"
            # - name: "zone-specific-override"
            #   when: 'event.metadata["topology.kubernetes.io/zone"] == "us-west1-a" && event.componentClass == "GPU"'
            #   override:
            #     isFatal: false
kubernetes-object-monitor:
  logLevel: debug
  # Short resync period for faster test feedback (production should use 30s+)
  resyncPeriod: 5s
  policies:
    - name: node-test-condition
      enabled: true
      resource:
        group: ""
        version: v1
        kind: Node
      predicate:
        expression: |
          resource.status.conditions.filter(c, c.type == "TestCondition" && c.status == "False").size() > 0
      healthEvent:
        componentClass: Node
        isFatal: false
        message: "Node test condition is not ready"
        recommendedAction: CONTACT_SUPPORT
        errorCode:
          - NODE_TEST_CONDITION_NOT_READY
    # This policy monitors DaemonSet pods in the gpu-operator namespace and publishes
    # fatal health events when pods are unhealthy. It detects:
    # 1. Pods not in Running/Succeeded phase (e.g., Pending, Failed)
    # 2. Pods in CrashLoopBackOff (phase=Running but container is crashing)
    #
    - name: gpu-operator-pod-health
      enabled: true
      resource:
        group: ""
        version: v1
        kind: Pod
      predicate:
        # Trigger event if:
        # 1. Pod is in gpu-operator namespace
        # 2. Pod is owned by a DaemonSet (filters to only monitor DaemonSet pods)
        # 3. Pod has been assigned to a node (nodeName is set)
        # 4. Pod is unhealthy: either NOT in Running/Succeeded state OR in CrashLoopBackOff
        # 5. Pod has been running for at least 30 seconds (grace period)
        #
        # Note: CrashLoopBackOff pods have phase=Running but container is in Waiting state
        # with reason=CrashLoopBackOff, so we must check containerStatuses explicitly.
        expression: "resource.metadata.namespace == 'gpu-operator' && \nhas(resource.metadata.ownerReferences) &&\nresource.metadata.ownerReferences.exists(r, r.kind == 'DaemonSet') &&\nhas(resource.spec.nodeName) && resource.spec.nodeName != \"\" &&\nhas(resource.status.startTime) &&\nnow - timestamp(resource.status.startTime) > duration('30s') &&\n(\n  (resource.status.phase != 'Running' && resource.status.phase != 'Succeeded') ||\n  (\n    has(resource.status.containerStatuses) &&\n    resource.status.containerStatuses.exists(cs,\n      has(cs.state.waiting) && \n      has(cs.state.waiting.reason) && \n      cs.state.waiting.reason == 'CrashLoopBackOff'\n    )\n  )\n)\n"
      nodeAssociation:
        expression: resource.spec.nodeName
      healthEvent:
        componentClass: Software
        isFatal: true
        message: "GPU Operator DaemonSet pod is unhealthy (not Running or in CrashLoopBackOff)"
        recommendedAction: CONTACT_SUPPORT
        errorCode:
          - GPU_OPERATOR_POD_UNHEALTHY
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: kwok
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          topologyKey: kubernetes.io/hostname
nvcre-certification-monitor:
  logLevel: debug
  # Short sweep interval for faster test feedback (production default is 15m).
  # Tilt installs only the cluster-readiness-engine Certification CRD
  # (tilt/nvcre-certification-crd.yaml), not the NVCRE controller; the e2e test
  # writes Certification status itself.
  resyncInterval: 30s
event-exporter:
  replicaCount: 1
  image:
    repository: ghcr.m.daocloud.io/nvidia/nvsentinel/event-exporter
    pullPolicy: IfNotPresent
    tag: v1.23.0
  podAnnotations: {}
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  oidcSecretName: "event-exporter-oidc-secret"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: kwok
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          topologyKey: kubernetes.io/hostname
  exporter:
    metadata:
      cluster: "tilt-test-cluster"
      environment: "development"
      tilt_test: "true"
    sink:
      endpoint: "http://event-exporter-mock.nvsentinel.svc.cluster.local:8443/events"
      timeout: "30s"
      insecureSkipVerify: true
    oidc:
      tokenUrl: "http://event-exporter-mock.nvsentinel.svc.cluster.local:8443/token"
      clientId: "tilt-test-client"
      scope: "test-scope"
      insecureSkipVerify: true
    backfill:
      enabled: true
      maxAge: "1h"
      maxEvents: 10000
      batchSize: 100
      rateLimit: 100
    resumeToken:
      database: "nvsentinel"
      collection: "resumetokens"
    failureHandling:
      maxRetries: 3
      initialBackoff: "1s"
      maxBackoff: "10s"
      backoffMultiplier: 2.0
lifecycle-manager:
  config:
    readinessCriteria:
      - name: not-under-quarantine
        expression: >-
          !(has(node.metadata.annotations) && "quarantineHealthEvent" in node.metadata.annotations)
    tests:
      e2e-smoke-test:
        provider: k8s-job-provider
        image: m.daocloud.io/public.ecr.aws/docker/library/alpine:3.21
        command:
          - sh
          - -c
          - "sleep 5"
        supportsBatchingNodes: false
        minimumNodesPerBatch: 1
        batchFailurePolicy: fail
